services:
  robofei:
    build: .
    volumes:
      - .:/robot
      # Mount the X11 socket for communication
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /robot
    tty: true

    environment:
      # Pass the host's DISPLAY variable into the container
      - DISPLAY=${DISPLAY}
      # - XAUTHORITY=/tmp/.Xauthority
      # - HOME=/root

      # # Default: run tests with hot reload
      # command: uv run watchfiles --filter python "pytest -q"

    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/robot` directory in the container
        - action: sync
          path: .
          target: /robot
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock
